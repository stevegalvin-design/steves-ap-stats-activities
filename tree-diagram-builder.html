
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP Statistics Tree Diagram Builder</title>
<style>
:root{--navy:#0C2340;--gold:#FFD600;--white:#fff;--bg:#f3f6fa;--green:#137333;--red:#b3261e;--muted:#ccd6e2;--blue:#e8f1ff;--shadow:0 8px 24px rgba(12,35,64,.11)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif;line-height:1.45}.app{max-width:1100px;margin:auto;padding:0 18px 40px}.header{background:var(--navy);color:#fff;margin:0 calc(50% - 50vw) 24px;padding:24px max(18px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.header h1{font-size:clamp(1.1rem,2.7vw,1.75rem);margin:0}.header button{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.progress-wrap{margin-bottom:24px}.progress{height:10px;background:#dfe6ee;border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--gold);transition:width .35s}.steps{display:flex;justify-content:space-between;margin-top:10px}.step{text-align:center;font-size:.8rem;color:#718096;flex:1}.dot{width:24px;height:24px;border-radius:50%;background:#dfe6ee;margin:0 auto 5px;display:grid;place-items:center;font-weight:bold}.step.active,.step.done{color:var(--navy);font-weight:bold}.step.active .dot,.step.done .dot{background:var(--gold);color:var(--navy)}.card{background:#fff;border-radius:14px;padding:22px;margin:18px 0;box-shadow:var(--shadow)}.gold-heading{margin:-22px -22px 18px;padding:13px 18px;background:var(--gold);font-weight:800;border-radius:14px 14px 0 0}.intro{font-size:1.08rem}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode-card{border:2px solid #d9e1eb;border-radius:12px;padding:18px;cursor:pointer;transition:.2s}.mode-card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,214,0,.2)}.mode-card input{accent-color:var(--navy);margin-right:8px}.mode-card strong{font-size:1.05rem}.mode-card p{margin:8px 0 0;color:#46566a;font-size:.93rem}label{display:block;font-weight:bold;margin:16px 0 6px}input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid #b9c6d5;border-radius:8px;font-size:1rem;color:var(--navy)}button{border:0;border-radius:8px;padding:12px 18px;font-size:1rem;font-weight:bold;cursor:pointer;background:var(--navy);color:#fff}button.gold{background:var(--gold);color:var(--navy)}button.secondary{background:#e5ebf2;color:var(--navy)}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.question-title{font-size:1.2rem;font-weight:bold;margin-bottom:10px}.info,.feedback,.solution{border-radius:9px;padding:13px 15px;margin:14px 0}.info{background:var(--blue);border-left:5px solid #3977c9}.feedback.good{background:#e8f5e9;color:var(--green);border-left:5px solid var(--green)}.feedback.bad{background:#fdecea;color:var(--red);border-left:5px solid var(--red)}.solution{background:#f6f8fb;border-left:5px solid var(--gold)}.solution ol{margin:8px 0 0 22px}.tree-scroll{overflow-x:auto}.tree-svg{display:block;width:720px;max-width:none;height:auto;margin:auto}.branch{fill:none;stroke-width:2.5}.drawn{stroke:var(--navy)}.undrawn{stroke:var(--muted);stroke-dasharray:7 6}.node{fill:var(--navy);stroke:#fff;stroke-width:2}.node-text{fill:#fff;font-size:11px;text-anchor:middle;font-weight:bold}.event-label{fill:var(--navy);font-size:13px;font-weight:bold}.prob-pill{fill:var(--gold)}.prob-text{fill:var(--navy);font-size:13px;font-weight:bold;text-anchor:middle}.joint{fill:var(--navy);font-size:11px;font-style:italic}.muted{color:#607086}.badge{display:inline-block;background:#e5ebf2;padding:4px 8px;border-radius:99px;font-size:.82rem;font-weight:bold}.score{font-size:2.2rem;font-weight:800}.center{text-align:center}.hidden{display:none}.error-text{color:var(--red);font-weight:bold}.success-text{color:var(--green);font-weight:bold}@media(max-width:650px){.mode-grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}.card{padding:18px}.gold-heading{margin:-18px -18px 18px}}
</style>
</head>
<body>
<div id="root"><div class="app"><header class="header"><h1>AP Statistics Tree Diagram Builder</h1><button data-action="startOver">Start Over</button></header><div id="progress"></div><main id="app"></main></div></div>
<script>
const state={phase:1,mode:null,aName:'',bName:'',pA:null,pAc:null,pBA:null,pBcA:null,pBAc:null,pBcAc:null,drawn:{a:false,ac:false,bGivenA:false,bcGivenA:false,bGivenAc:false,bcGivenAc:false},phase3step:0,phase3PendingAdvance:false,question:0,score:0,answered:false,wrongComplement:false,lastCorrect:false};
const pickA=[.2,.25,.3,.35,.4,.45,.5,.55,.6,.65,.7,.75,.8],pickB=[.1,.15,.2,.25,.3,.35,.4,.45,.5,.55,.6,.65,.7,.75,.8,.85,.9];
function escapeHtml(x){return String(x).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function checkFraction(raw){const m=String(raw).trim().match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);return m&&Number(m[2])!==0?Number(m[1])/Number(m[2]):NaN}
function parseValue(raw,n=1){let s=String(raw).trim().replace(/,/g,'');if(/%$/.test(s))return parseFloat(s)/100;const f=checkFraction(s);if(Number.isFinite(f))return f;const v=Number(s);return Number.isFinite(v)?v/n:NaN}
function fmt(n){if(!Number.isFinite(Number(n)))return '?';const rounded=Number(Number(n).toPrecision(4));return Object.is(rounded,-0)?'0':String(rounded)}
function escName(x){return escapeHtml(x)}
function progress(){let pct=(state.phase-1)*25;return `<div class="progress-wrap"><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div><div class="steps">${['Setup','Build First Branch','Build Second Branches','Practice'].map((x,i)=>`<div class="step ${state.phase===i+1?'active':''} ${state.phase>i+1?'done':''}"><div class="dot">${i+1}</div>${x}</div>`).join('')}</div></div>`}
function pill(x){return `<rect class="prob-pill" x="${x-24}" y="-13" width="48" height="20" rx="7"></rect>`}
function branch(x1,y1,x2,y2,label,p,isDrawn,dx=0,dy=0){const mx=(x1+x2)/2+dx,my=(y1+y2)/2+dy;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="branch ${isDrawn?'drawn':'undrawn'}"/><text x="${mx}" y="${my-8}" class="event-label">${label}</text><g transform="translate(${mx},${my+10})">${pill(0)}<text x="0" y="1" class="prob-text">${isDrawn?fmt(p):'?'}</text></g>`}
function treeBlock(){const a=escName(state.aName),b=escName(state.bName),d=state.drawn,all=Object.values(d).every(Boolean);let joints=all?`<text x="620" y="27" class="joint">P(${a}∩${b}) = ${fmt(state.pA*state.pBA)}</text><text x="620" y="127" class="joint">P(${a}∩${b}ᶜ) = ${fmt(state.pA*state.pBcA)}</text><text x="620" y="207" class="joint">P(${a}ᶜ∩${b}) = ${fmt(state.pAc*state.pBAc)}</text><text x="620" y="307" class="joint">P(${a}ᶜ∩${b}ᶜ) = ${fmt(state.pAc*state.pBcAc)}</text>`:'';return `<div class="card"><div class="gold-heading">Your Probability Tree — use this as a reference</div><div class="tree-scroll"><svg class="tree-svg" viewBox="0 0 720 340" role="img" aria-label="Probability tree"><circle cx="80" cy="170" r="18" class="node"/><text x="80" y="174" class="node-text">Start</text>${branch(80,170,280,80,a,state.pA,d.a,0,-4)}${branch(80,170,280,260,a+'ᶜ',state.pAc,d.ac,0,4)}<circle cx="280" cy="80" r="18" class="node"/><circle cx="280" cy="260" r="18" class="node"/>${branch(280,80,520,30,b,state.pBA,d.bGivenA,0,-2)}${branch(280,80,520,130,b+'ᶜ',state.pBcA,d.bcGivenA,0,2)}${branch(280,260,520,210,b,state.pBAc,d.bGivenAc,0,-2)}${branch(280,260,520,310,b+'ᶜ',state.pBcAc,d.bcGivenAc,0,2)}<circle cx="520" cy="30" r="18" class="node"/><circle cx="520" cy="130" r="18" class="node"/><circle cx="520" cy="210" r="18" class="node"/><circle cx="520" cy="310" r="18" class="node"/>${joints}</svg></div></div>`}
function setup(){return `<div class="card intro">Let's build your probability tree. You'll enter probabilities one branch at a time and watch the tree grow. Then you'll answer probability questions using the completed tree.</div><div class="card"><div class="gold-heading">Set Up Your Problem</div><div class="question-title">How would you like to set up your problem?</div><div class="mode-grid"><label class="mode-card ${state.mode==='own'?'selected':''}" data-action="chooseMode" data-value="own"><input type="radio" name="mode" value="own" ${state.mode==='own'?'checked':''}><strong>I have a problem</strong><p>Enter your own probabilities from a textbook, worksheet, or AP FRQ.</p></label><label class="mode-card ${state.mode==='generate'?'selected':''}" data-action="chooseMode" data-value="generate"><input type="radio" name="mode" value="generate" ${state.mode==='generate'?'checked':''}><strong>Generate a problem for me</strong><p>The tool will supply the probabilities. You provide the event names.</p></label></div><label>First event name</label><input id="aName" type="text" placeholder="e.g., Plays a sport" value="${escName(state.aName)}"><label>Second event name</label><input id="bName" type="text" placeholder="e.g., Has a job" value="${escName(state.bName)}">${state.mode==='own'?'<label>P(<span id="aLabel">'+(state.aName?escName(state.aName):'[Event 1 name]')+'</span>) — probability of the first event</label><input id="pA" type="text" placeholder="fraction, decimal, or percent">':''}<div id="setupError"></div><div class="actions"><button class="gold" data-action="continueSetup">Continue</button></div></div>`}
function phase2(){if(state.mode==='generate'&&!state.pA){state.pA=pickA[Math.floor(Math.random()*pickA.length)];state.pAc=1-state.pA;state.drawn.a=true}let content;if(!state.drawn.a)content='<div class="feedback bad">Waiting for the first event branch to be initialized.</div>';else if(!state.drawn.ac)content=`<div class="question-title">What is P(${escName(state.aName)}ᶜ)?</div><p class="muted">The probability that ${escName(state.aName)} does <strong>not</strong> occur.</p><input id="answer" type="text" placeholder="fraction, decimal, or percent"><div class="actions"><button class="gold" data-action="checkAc">Check Answer</button></div>`;else content=`<div class="feedback good">Both first-level branches are complete!</div>${state.wrongComplement?`<div class="feedback bad">Not quite. The correct complement has been filled in: P(${escName(state.aName)}ᶜ) = ${fmt(state.pAc)}.</div>`:''}<div class="actions"><button class="gold" data-action="goPhase3">Continue to Phase 3</button></div>`;return `${treeBlock()}<div class="card"><div class="gold-heading">Phase 2 — Build First Branch</div>${state.mode==='generate'?`<div class="info">For this problem, P(${escName(state.aName)}) = <strong>${fmt(state.pA)}</strong></div>`:`<div class="feedback good">P(${escName(state.aName)}) = ${fmt(state.pA)} is confirmed, and the branch has been drawn.</div>`}${content}</div>`}
function phase3(){if(state.mode==='generate'&&state.phase3step===0&&!state.pBA){state.pBA=pickB[Math.floor(Math.random()*pickB.length)];do{state.pBAc=pickB[Math.floor(Math.random()*pickB.length)]}while(state.pBAc===state.pBA||state.pBAc===state.pA);state.pBcA=1-state.pBA;state.pBcAc=1-state.pBAc}let s=state.phase3step,a=escName(state.aName),b=escName(state.bName),given=state.mode==='generate',configs=[{key:'bGivenA',question:`What is P(${b} | ${a})?`,value:state.pBA,info:`For this problem, P(${b} | ${a}) = <strong>${fmt(state.pBA)}</strong>`},{key:'bcGivenA',question:`What is P(${b}ᶜ | ${a})?`,value:state.pBcA,info:null},{key:'bGivenAc',question:`What is P(${b} | ${a}ᶜ)?`,value:state.pBAc,info:`For this problem, P(${b} | ${a}ᶜ) = <strong>${fmt(state.pBAc)}</strong>`},{key:'bcGivenAc',question:`What is P(${b}ᶜ | ${a}ᶜ)?`,value:state.pBcAc,info:null}],c=configs[s],auto=given&&(s===0||s===2);return `${treeBlock()}<div class="card"><div class="gold-heading">Phase 3 — Build Second Branches</div><div class="badge">Step ${s+1} of 4</div>${auto?`<div class="info">${c.info}</div><div class="feedback good">This branch has been drawn automatically.</div><div class="actions"><button class="gold" data-action="advance3">Continue</button></div>`:state.phase3PendingAdvance?`<div class="question-title">${c.question}</div><div class="feedback bad">Not quite. Remember, the two conditional branches from the same node must add to 1. The correct value is ${fmt(c.value)}. The branch has been filled in for you.</div><div class="actions"><button class="gold" data-action="continueAfter3Feedback">Continue</button></div>`:`<div class="question-title">${c.question}</div><p class="muted">Enter a probability between 0 and 1, as a fraction, decimal, or percent.</p><input id="answer" type="text" placeholder="fraction, decimal, or percent"><div id="phase3Feedback"></div><div class="actions"><button class="gold" data-action="check3">Check Answer</button></div>`}</div>`}
function practice(){const a=escName(state.aName),b=escName(state.bName),pAB=state.pA*state.pBA,pABc=state.pA*state.pBcA,pAcB=state.pAc*state.pBAc,pAcBc=state.pAc*state.pBcAc,pB=pAB+pAcB,q=state.question,ind=Math.abs(state.pBA-state.pBAc)<=.005,qs=[{text:`P(${a} ∩ ${b})`,ans:pAB,ex:`P(${a} ∩ ${b}) = P(${a}) × P(${b} | ${a}) = ${fmt(state.pA)} × ${fmt(state.pBA)} = ${fmt(pAB)}. Multiply along the top path of the tree.`,steps:[`Identify the path: ${a} first, then ${b}.`,`Multiply along the path: P(${a}) × P(${b} | ${a}).`,`Substitute: ${fmt(state.pA)} × ${fmt(state.pBA)} = ${fmt(pAB)}.`]},{text:`P(${a} ∩ ${b}ᶜ)`,ans:pABc,ex:`P(${a} ∩ ${b}ᶜ) = P(${a}) × P(${b}ᶜ | ${a}) = ${fmt(state.pA)} × ${fmt(state.pBcA)} = ${fmt(pABc)}.`,steps:[`Identify the path: ${a} first, then NOT ${b}.`,`Multiply along the path: P(${a}) × P(${b}ᶜ | ${a}).`,`Substitute: ${fmt(state.pA)} × ${fmt(state.pBcA)} = ${fmt(pABc)}.`]},{text:`P(${a}ᶜ ∩ ${b})`,ans:pAcB,ex:`P(${a}ᶜ ∩ ${b}) = P(${a}ᶜ) × P(${b} | ${a}ᶜ) = ${fmt(state.pAc)} × ${fmt(state.pBAc)} = ${fmt(pAcB)}.`,steps:[`Identify the path: NOT ${a} first, then ${b}.`,`Multiply along the path: P(${a}ᶜ) × P(${b} | ${a}ᶜ).`,`Substitute: ${fmt(state.pAc)} × ${fmt(state.pBAc)} = ${fmt(pAcB)}.`]},{text:`P(${a}ᶜ ∩ ${b}ᶜ)`,ans:pAcBc,ex:`P(${a}ᶜ ∩ ${b}ᶜ) = P(${a}ᶜ) × P(${b}ᶜ | ${a}ᶜ) = ${fmt(state.pAc)} × ${fmt(state.pBcAc)} = ${fmt(pAcBc)}.`,steps:[`Identify the path: NOT ${a} first, then NOT ${b}.`,`Multiply along the path: P(${a}ᶜ) × P(${b}ᶜ | ${a}ᶜ).`,`Substitute: ${fmt(state.pAc)} × ${fmt(state.pBcAc)} = ${fmt(pAcBc)}.`]},{text:`P(${b}) — the total probability of ${b}`,ans:pB,ex:`P(${b}) = P(${a}∩${b}) + P(${a}ᶜ∩${b}) = ${fmt(pAB)} + ${fmt(pAcB)} = ${fmt(pB)}. Add the two paths that end in ${b}.`,steps:[`${b} can occur two ways: via ${a} or via ${a}ᶜ.`,`P(${a} ∩ ${b}) = ${fmt(state.pA)} × ${fmt(state.pBA)} = ${fmt(pAB)}.`,`P(${a}ᶜ ∩ ${b}) = ${fmt(state.pAc)} × ${fmt(state.pBAc)} = ${fmt(pAcB)}.`,`Add: ${fmt(pAB)} + ${fmt(pAcB)} = ${fmt(pB)}.`]},{text:`P(${b}ᶜ) — the total probability of NOT ${b}`,ans:1-pB,ex:`P(${b}ᶜ) = 1 − P(${b}) = 1 − ${fmt(pB)} = ${fmt(1-pB)}. Or add the two paths ending in ${b}ᶜ.`,steps:[`Use the complement rule: P(${b}ᶜ) = 1 − P(${b}).`,`P(${b}) = ${fmt(pB)} (from the two paths ending in ${b}).`,`P(${b}ᶜ) = 1 − ${fmt(pB)} = ${fmt(1-pB)}.`]},{text:`P(${a} | ${b}) — reverse conditional`,ans:pAB/pB,ex:`P(${a} | ${b}) = P(${a} ∩ ${b}) / P(${b}) = ${fmt(pAB)} / ${fmt(pB)} = ${fmt(pAB/pB)}.`,steps:[`Use the conditional probability formula: P(${a} | ${b}) = P(${a} ∩ ${b}) / P(${b}).`,`P(${a} ∩ ${b}) = ${fmt(pAB)}.`,`P(${b}) = ${fmt(pB)}.`,`Divide: ${fmt(pAB)} ÷ ${fmt(pB)} = ${fmt(pAB/pB)}.`]},{text:`Are ${a} and ${b} independent? (yes/no)`,ans:ind,ex:ind?`Yes. P(${b} | ${a}) = ${fmt(state.pBA)} and P(${b} | ${a}ᶜ) = ${fmt(state.pBAc)}. These are equal, so knowing ${a} does not change the probability of ${b}.`:`No. P(${b} | ${a}) = ${fmt(state.pBA)} but P(${b} | ${a}ᶜ) = ${fmt(state.pBAc)}. These differ, so ${a} and ${b} are not independent.`,steps:ind?[`Two events are independent if P(${b} | ${a}) = P(${b} | ${a}ᶜ).`,`P(${b} | ${a}) = ${fmt(state.pBA)}; P(${b} | ${a}ᶜ) = ${fmt(state.pBAc)}.`,`These are equal, so ${a} and ${b} ARE independent.`]:[`Two events are independent if P(${b} | ${a}) = P(${b} | ${a}ᶜ).`,`P(${b} | ${a}) = ${fmt(state.pBA)}; P(${b} | ${a}ᶜ) = ${fmt(state.pBAc)}.`,`These are not equal, so ${a} and ${b} are NOT independent.`]}][q];return `${treeBlock()}<div class="card"><div class="gold-heading">Phase 4 — Practice</div><div class="badge">Question ${q+1} of 8</div><div class="question-title">${qs.text}</div><input id="answer" type="text" placeholder="fraction, decimal, percent, or yes/no" ${state.answered?'disabled':''}>${state.answered?`<div class="feedback ${state.lastCorrect?'good':'bad'}">${state.lastCorrect?'Correct! ✓':'Not quite.'} ${qs.ex}</div><div class="solution"><strong>Worked solution</strong><ol>${qs.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="actions"><button class="gold" data-action="nextQuestion">${q===7?'See Results':'Next Question'}</button></div>`:`<div class="actions"><button class="gold" data-action="checkPractice">Check Answer</button></div>`}</div>`}
function completion(){return `${treeBlock()}<div class="card center"><div class="gold-heading">Complete!</div><div class="score">${state.score}/8</div><p>${state.score===8?'Excellent work! You mastered this probability tree.':state.score>=6?'Great job! Review the worked solutions for any missed ideas.':'Keep practicing—the tree and worked solutions can help you improve.'}</p><button class="gold" data-action="practiceAgain">Practice Again</button></div>`}
function render(){document.getElementById('progress').innerHTML=progress();document.getElementById('app').innerHTML=state.phase===1?setup():state.phase===2?phase2():state.phase===3?phase3():state.phase===4?(state.question>=8?completion():practice()):'';const a=document.getElementById('aName'),lab=document.getElementById('aLabel');if(a&&lab)a.addEventListener('input',()=>lab.textContent=a.value||'[Event 1 name]')}
function chooseMode(m){state.mode=m;render()}
function continueSetup(){const a=document.getElementById('aName').value.trim(),b=document.getElementById('bName').value.trim(),err=document.getElementById('setupError');if(!a||!b){err.innerHTML='<div class="feedback bad">Both event names are required.</div>';return}state.aName=a;state.bName=b;state.mode=state.mode||'own';if(state.mode==='own'){const v=parseValue(document.getElementById('pA').value);if(!Number.isFinite(v)||v<=0||v>=1){err.innerHTML='<div class="feedback bad">Enter P(first event) as a valid probability strictly between 0 and 1.</div>';return}state.pA=v}else state.pA=pickA[Math.floor(Math.random()*pickA.length)];state.pAc=1-state.pA;state.phase=2;state.drawn.a=true;state.drawn.ac=false;state.wrongComplement=false;render()}
function checkAc(){const v=parseValue(document.getElementById('answer').value);if(Number.isFinite(v)&&Math.abs(v-state.pAc)<=.005){state.drawn.ac=true;state.wrongComplement=false}else{state.wrongComplement=true;state.drawn.ac=true}render()}
function goPhase3(){if(state.drawn.a&&state.drawn.ac){state.phase=3;state.phase3PendingAdvance=false;render()}}
function advance3(){const s=state.phase3step;if(s===0)state.drawn.bGivenA=true;if(s===2)state.drawn.bGivenAc=true;state.phase3step++;state.phase3PendingAdvance=false;if(state.phase3step>=4)state.phase=4;render()}
function continueAfter3Feedback(){const s=state.phase3step;if(s===1)state.pBcA=1-state.pBA;if(s===3)state.pBcAc=1-state.pBAc;state.phase3PendingAdvance=false;state.phase3step++;if(state.phase3step>=4)state.phase=4;render()}
function check3(){const v=parseValue(document.getElementById('answer').value),s=state.phase3step,complement=s===1||s===3,previousBranch=s===1?state.pBA:state.pBAc,expected=complement?parseFloat((1-previousBranch).toPrecision(4)):[state.pBA,state.pBcA,state.pBAc,state.pBcAc][s],valid=Number.isFinite(v)&&v>0&&v<1;if(!valid){document.getElementById('phase3Feedback').innerHTML='<div class="feedback bad">Enter a valid probability strictly between 0 and 1.</div>';return}if(complement&&Math.abs(v-expected)<=.005){if(s===1)state.pBcA=expected;if(s===3)state.pBcAc=expected;state.drawn[['bGivenA','bcGivenA','bGivenAc','bcGivenAc'][s]]=true;state.phase3step++;if(state.phase3step>=4)state.phase=4;render()}else if(complement){state.drawn[['bGivenA','bcGivenA','bGivenAc','bcGivenAc'][s]]=true;state.phase3PendingAdvance=true;render()}else if(v>0&&v<1){if(s===0)state.pBA=v;if(s===2)state.pBAc=v;state.drawn[['bGivenA','bcGivenA','bGivenAc','bcGivenAc'][s]]=true;state.phase3step++;if(state.phase3step>=4)state.phase=4;render()}else document.getElementById('phase3Feedback').innerHTML='<div class="feedback bad">Enter a valid probability strictly between 0 and 1.</div>'}
function checkPractice(){const a=document.getElementById('answer').value.trim(),q=state.question,pAB=state.pA*state.pBA,pAcB=state.pAc*state.pBAc,pB=pAB+pAcB,target=[state.pA*state.pBA,state.pA*state.pBcA,state.pAc*state.pBAc,state.pAc*state.pBcAc,pB,1-pB,pAB/pB,Math.abs(state.pBA-state.pBAc)<=.005][q];let ok;if(q===7)ok=/^(yes|y)$/i.test(a)==target||/^(no|n)$/i.test(a)==!target;else{const v=parseValue(a);ok=Number.isFinite(v)&&Math.abs(v-target)<=.005}state.lastCorrect=ok;if(ok)state.score++;state.answered=true;render()}
function nextQuestion(){state.question++;state.answered=false;render()}
function practiceAgain(){state.question=0;state.score=0;state.answered=false;render()}
function startOver(){Object.assign(state,{phase:1,mode:null,aName:'',bName:'',pA:null,pAc:null,pBA:null,pBcA:null,pBAc:null,pBcAc:null,phase3step:0,phase3PendingAdvance:false,question:0,score:0,answered:false,wrongComplement:false,lastCorrect:false});Object.assign(state.drawn,{a:false,ac:false,bGivenA:false,bcGivenA:false,bGivenAc:false,bcGivenAc:false});render()}
document.addEventListener('click',function(e){const btn=e.target.closest('[data-action]');if(!btn)return;const action=btn.dataset.action;const value=btn.dataset.value;switch(action){case'chooseMode':chooseMode(value);break;case'continueSetup':continueSetup();break;case'checkAc':checkAc();break;case'goPhase3':goPhase3();break;case'advance3':advance3();break;case'continueAfter3Feedback':continueAfter3Feedback();break;case'check3':check3();break;case'checkPractice':checkPractice();break;case'nextQuestion':nextQuestion();break;case'practiceAgain':practiceAgain();break;case'startOver':startOver();break}});
render();
</script>
